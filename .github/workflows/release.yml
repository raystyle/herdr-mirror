name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          # herdr's four targets; musl gives static linux binaries that cover
          # both -gnu and -musl systems with one asset per arch
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset: herdr-mirror-linux-x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            asset: herdr-mirror-linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset: herdr-mirror-darwin-x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: herdr-mirror-darwin-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/herdr-mirror ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # 建 Release
      actions: write # 派发播种 gh workflow run(workflow_dispatch 面)
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: checksums (聚合加逐件边车;逐件形对齐 fleet 镜像锚契约)
        run: |
          shasum -a 256 herdr-mirror-* > SHA256SUMS
          for f in herdr-mirror-*; do shasum -a 256 "$f" > "$f.sha256"; done
      # 镜像播种已拆至 r2-seed.yml(零上传红灯两段报数;编译发布链失败不再连坐灌段)。
      # 评审 F1:本步 Release 以 github.token 建,release: published 事件不触发新
      # run(Actions 防递归),r2-seed 的 published 腿不点火,改由下步显式派发
      # (workflow_dispatch 是 GITHUB_TOKEN 例外)。批 3 发布迁本地 gh 直发后撤本步。
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            herdr-mirror-*
            SHA256SUMS
      - name: 派发 r2-seed 播种
        # 无 checkout,gh 需显式 --repo 才能解析仓(评审实测);派发成功不等于播种
        # 成功,seed run 结论需另看 r2-seed 的 run。回显为信息面:新 run 入列有滞
        # 后,--event 过滤派发形,|| true 防回显把已成功派发的 job 变红;回显按默认
        # 分支解析 r2-seed.yml,依赖「修复链先推、tag 后打」前置(派发本身走 --ref
        # 不受影响)。
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh workflow run r2-seed.yml --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}" -f tag="${GITHUB_REF_NAME}"
          gh run list --workflow r2-seed.yml --repo "${GITHUB_REPOSITORY}" \
            --event workflow_dispatch --limit 1 || true
