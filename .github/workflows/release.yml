name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # herdr's four targets; musl gives static linux binaries that cover
          # both -gnu and -musl systems with one asset per arch
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset: herdr-mirror-linux-x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            asset: herdr-mirror-linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset: herdr-mirror-darwin-x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: herdr-mirror-darwin-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/herdr-mirror ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: checksums (聚合加逐件边车;逐件形对齐 fleet 镜像锚契约)
        run: |
          shasum -a 256 herdr-mirror-* > SHA256SUMS
          for f in herdr-mirror-*; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            herdr-mirror-*
            SHA256SUMS
      - name: mirror fleet 段自推 (omc 接管分发 2026-09-17;env 桶 herdr/<version>/)
        if: always()
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          VER="${GITHUB_REF_NAME#v}"
          curl -fsSL https://github.com/raystyle/herdr-mirror/raw/main/.tools/rclone-pin.sh | bash -s -- 2>/dev/null || {
            curl -fsSLo rclone.tgz https://downloads.rclone.org/rclone-current-linux-amd64.zip && unzip -o -q rclone.tgz && sudo mv rclone-*/rclone /usr/local/bin/rclone
          } || true
          rclone --version
          for f in herdr-mirror-* SHA256SUMS; do
            [ -f "$f.sha256" ] && rclone copyto "$f.sha256" "r2:env/herdr/${VER}/${f}.sha256" --header-upload "Cache-Control: public, max-age=31536000, immutable"
            rclone copyto "$f" "r2:env/herdr/${VER}/${f}" --header-upload "Cache-Control: public, max-age=31536000, immutable"
          done
          rclone lsl "r2:env/herdr/${VER}/" | wc -l
            SHA256SUMS
