name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # herdr's four targets; musl gives static linux binaries that cover
          # both -gnu and -musl systems with one asset per arch
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset: herdr-mirror-linux-x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            asset: herdr-mirror-linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset: herdr-mirror-darwin-x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: herdr-mirror-darwin-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/herdr-mirror ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: checksums (聚合加逐件边车;逐件形对齐 fleet 镜像锚契约)
        run: |
          shasum -a 256 herdr-mirror-* > SHA256SUMS
          for f in herdr-mirror-*; do shasum -a 256 "$f" > "$f.sha256"; done
      # 镜像播种已拆至 r2-seed.yml(Release published 触发 + dispatch 补推口,
      # 零上传红灯两段报数;编译发布链失败不再连坐灌段)
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            herdr-mirror-*
            SHA256SUMS
